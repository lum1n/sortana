# Curated model lineups, one per model maker. Each `models` list holds
# models.dev canonical ids (without the maker prefix) in tier order:
# [simple, medium, hard, very_hard]. A model may repeat when the maker has
# fewer than four distinct tiers.
#
# Optional `native` lists the ids on the maker's own API when they differ from
# the canonical names (the script warns when it cannot confirm one).
#
# After editing, regenerate src/catalog.rs:
#   python3 scripts/update-catalog.py

[anthropic]
name = "Anthropic"
models = ["claude-haiku-5-5", "claude-sonnet-5-5", "claude-opus-5-5", "claude-fable-5-1"]

[openai]
name = "OpenAI"
models = ["gpt-6-luna", "gpt-6.1-terra", "gpt-6.1-sol", "gpt-6-astra"]

[google]
name = "Google"
models = ["gemini-3.5-flash-lite", "gemini-3.6-flash", "gemini-3.8-flash", "gemini-4-argon"]

[mistral]
name = "Mistral"
models = ["ministral-14b-2512", "mistral-small-2603", "mistral-medium-3-5", "mistral-large-4"]
# Mistral's API lists Medium 3.5 by its dated id.
native = ["ministral-14b-2512", "mistral-small-2603", "mistral-medium-2604", "mistral-large-4"]

[xai]
name = "xAI"
models = ["grok-4.3", "grok-4.3", "grok-4.7", "grok-4.7"]

[deepseek]
name = "DeepSeek"
models = ["deepseek-v4.1-flash", "deepseek-v4.1-flash", "deepseek-v4-pro", "deepseek-v4-pro"]
# DeepSeek's API serves these under aliases.
native = ["deepseek-flash", "deepseek-flash", "deepseek-v4-pro", "deepseek-v4-pro"]

[alibaba]
